services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --http-port=8080 --import-realm
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_PASSWORD}
      ACCESSOPS_PORTAL_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      ACCESSOPS_AUTOMATION_CLIENT_SECRET: ${KEYCLOAK_AUTOMATION_CLIENT_SECRET}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=30
    volumes:
      - ./keycloak/accessops-realm.json:/opt/keycloak/data/import/accessops-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/accessops/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

